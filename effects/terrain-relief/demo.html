<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contour: Beamish demo</title>
    <link rel="stylesheet" href="../../shared/tokens.css" />
    <link rel="stylesheet" href="../../shared/fonts.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: rgb(var(--background-deep));
        font-family: var(--font-mono);
      }
      #stage {
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <!--
      Standalone. No site chrome: this page exists so the recorder has something
      deterministic to screenshot, and so the effect can be opened on its own
      without a build step. `pnpm build:items` produces demo.bundle.js.
    -->
    <div id="stage"></div>

    <script src="./demo.bundle.js"></script>
    <script>
      const stage = document.getElementById('stage')
      const handle = window.Beamish.create(stage)

      // The recorder drives renderAtTime itself and must not race a RAF loop.
      window.__beamish = handle
      if (!new URLSearchParams(location.search).has('record')) handle.start()
    </script>
  </body>
</html>
