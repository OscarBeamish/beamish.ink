<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GlassPanel: Beamish demo</title>
    <link rel="stylesheet" href="../../shared/tokens.css" />
    <link rel="stylesheet" href="../../shared/fonts.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: rgb(var(--background-deep));
        color: var(--label-1);
        font-family: var(--font-mono);
      }
      #stage {
        width: 100vw;
        height: 100vh;
        position: relative;
      }
      /*
       * The images are the content. They are laid out normally and the effect
       * hides them once it has uploaded them, so a browser with no JavaScript
       * shows the pictures and a screen reader still reads the alt text.
       */
      #stage img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      /*
       * The control that sits on the glass.
       *
       * Apple's rule for this material is that it belongs to the layer that
       * floats above content, not to content itself, so the thing on the glass
       * is a control rather than a paragraph. The capsule is inset from the
       * edges and sits low in the frame, which is where a thumb reaches.
       *
       * Lined up with the panel options, which are shares of the element, so
       * the control and the glass stay together through a resize.
       */
      .capsule {
        position: absolute;
        left: 28%;
        top: 76.25%;
        width: 44%;
        height: 11.5%;
        display: flex;
        align-items: center;
        gap: 0.7rem;
        padding: 0 clamp(0.9rem, 2vw, 1.4rem);
        box-sizing: border-box;
        /* Light labels on smoked glass. Dimming a photograph leaves it
           looking like a photograph; milking it does not. */
        color: #ffffff;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
      }
      /* The label is the accessible name. The placeholder is not one: it goes
         the moment anybody types, and it is not announced by everything. */
      .capsule__label {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      .capsule__icon {
        flex: none;
        width: clamp(0.85rem, 1.6vw, 1.05rem);
        height: clamp(0.85rem, 1.6vw, 1.05rem);
        opacity: 0.7;
      }
      .capsule__input {
        flex: 1;
        min-width: 0;
        border: 0;
        background: transparent;
        color: inherit;
        font: inherit;
        font-size: clamp(0.72rem, 1.5vw, 0.95rem);
        letter-spacing: 0.01em;
      }
      /* A placeholder still has to be readable. 0.62 looked right and
         measured worse than the text it stands in for. */
      .capsule__input::placeholder {
        color: inherit;
        opacity: 0.88;
      }
      .capsule__input:focus {
        outline: none;
      }
      /* The focus ring goes on the capsule, because the input has no edges of
         its own: the glass is its edge. */
      .capsule:focus-within {
        outline: 2px solid var(--accent);
        outline-offset: 6px;
        border-radius: 100px;
      }
      .capsule__hint {
        flex: none;
        padding: 0.15rem 0.45rem;
        border: 1px solid currentColor;
        border-radius: 5px;
        font-family: inherit;
        font-size: clamp(0.55rem, 1vw, 0.68rem);
        opacity: 0.88;
      }
    </style>
  </head>
  <body>
    <!--
      Standalone. No site chrome: this page exists so the recorder has something
      deterministic to screenshot, and so the effect can be opened on its own
      without a build step. `pnpm build:items` produces demo.bundle.js.
    -->
    <div id="stage">
      <img
        src="./demo-plates/mountain.jpg"
        alt="Mountain ridges at dawn, lit from behind by a pink sky"
      />
      <!--
        A real form, above the canvas. The canvas draws the glass; this is the
        control, and it has to be DOM so it can be focused, typed into, read
        aloud and submitted.
      -->
      <form class="capsule" role="search" action="#results">
        <label class="capsule__label" for="capsule-q">Search the library</label>
        <svg class="capsule__icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
          <circle cx="7" cy="7" r="4.4" fill="none" stroke="currentColor" stroke-width="1.6" />
          <path d="M10.4 10.4 L14 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        </svg>
        <input
          class="capsule__input"
          id="capsule-q"
          type="search"
          name="q"
          placeholder="Search the library"
          autocomplete="off"
        />
        <kbd class="capsule__hint">/</kbd>
      </form>
    </div>

    <script src="./demo.bundle.js"></script>
    <script>
      const handle = window.Beamish.create(document.getElementById('stage'))
      window.__beamish = handle
      /*
       * Not while recording. The recorder drives the effect one frame at a time
       * through renderAtTime, and a live loop running alongside it will paint a
       * frame of its own between that call and the screenshot.
       */
      if (!new URLSearchParams(location.search).has('record')) handle.start()
    </script>
  </body>
</html>
