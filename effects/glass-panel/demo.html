<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GlassPanel: Beamish demo</title>
    <link rel="stylesheet" href="../../shared/tokens.css" />
    <link rel="stylesheet" href="../../shared/fonts.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: rgb(var(--background-deep));
        color: var(--label-1);
        font-family: var(--font-mono);
      }
      #stage {
        width: 100vw;
        height: 100vh;
        position: relative;
      }
      /*
       * The images are the content. They are laid out normally and the effect
       * hides them once it has uploaded them, so a browser with no JavaScript
       * shows the pictures and a screen reader still reads the alt text.
       */
      #stage img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      /*
       * The plate's own markup, above the canvas. The canvas draws the glass;
       * this is the content, and it has to be real DOM so it can be focused,
       * selected, translated and read aloud.
       *
       * Lined up with the panel options, which are shares of the element, so
       * the two stay together when the frame changes shape.
       */
      .plate {
        position: absolute;
        left: 9%;
        top: 42%;
        width: 54%;
        height: 42%;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;
        gap: 0.7rem;
        padding: 0 clamp(1.2rem, 3vw, 2.4rem);
        box-sizing: border-box;
        color: #1c1a16;
      }
      .plate__eyebrow {
        margin: 0;
        font-size: 0.68rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        opacity: 0.75;
      }
      .plate__title {
        margin: 0;
        font-family: var(--font-display);
        font-size: clamp(1.5rem, 4.2vw, 3rem);
        line-height: 0.98;
        letter-spacing: -0.03em;
      }
      .plate__line {
        margin: 0;
        max-width: 34ch;
        font-size: clamp(0.72rem, 1.4vw, 0.92rem);
        line-height: 1.55;
        opacity: 0.82;
      }
      .plate__action {
        margin-top: 0.3rem;
        padding: 0.6rem 1.2rem;
        border: 1px solid currentColor;
        border-radius: 100px;
        font-size: 0.66rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        text-decoration: none;
        color: inherit;
      }
      .plate__action:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <!--
      Standalone. No site chrome: this page exists so the recorder has something
      deterministic to screenshot, and so the effect can be opened on its own
      without a build step. `pnpm build:items` produces demo.bundle.js.
    -->
    <div id="stage">
      <img
        src="./demo-plates/mountain.jpg"
        alt="Mountain ridges at dawn, lit from behind by a pink sky"
      />
      <div class="plate">
        <p class="plate__eyebrow">Field notes</p>
        <h1 class="plate__title">A headline sits here</h1>
        <p class="plate__line">
          And a line of supporting copy under it, about the length a real one runs,
          so the glass has something to hold.
        </p>
        <a class="plate__action" href="#read">Read the piece</a>
      </div>
    </div>

    <script src="./demo.bundle.js"></script>
    <script>
      const handle = window.Beamish.create(document.getElementById('stage'))
      window.__beamish = handle
      /*
       * Not while recording. The recorder drives the effect one frame at a time
       * through renderAtTime, and a live loop running alongside it will paint a
       * frame of its own between that call and the screenshot.
       */
      if (!new URLSearchParams(location.search).has('record')) handle.start()
    </script>
  </body>
</html>
