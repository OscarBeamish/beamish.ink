<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spool: Beamish demo</title>
    <link rel="stylesheet" href="../../shared/tokens.css" />
    <link rel="stylesheet" href="../../shared/fonts.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: rgb(var(--background-deep));
        color: var(--label-1);
        font-family: var(--font-mono);
      }
      #stage {
        width: 100vw;
        height: 100vh;
        position: relative;
      }
      /*
       * The images are the content. They are laid out normally and the effect
       * hides them once it has uploaded them, so a browser with no JavaScript
       * shows the pictures and a screen reader still reads the alt text.
       */
      #stage img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <!--
      Standalone. No site chrome: this page exists so the recorder has something
      deterministic to screenshot, and so the effect can be opened on its own
      without a build step. `pnpm build:items` produces demo.bundle.js.
    -->
    <div id="stage">
      <img src="./demo-plates/halftone-backdrop.jpg" alt="Halftone dots in two inks drifting over warm paper" />
      <img src="./demo-plates/guilloche-lines.jpg" alt="Engine-turned line work radiating from a central rosette" />
      <img src="./demo-plates/pointer-ripple-grid.jpg" alt="Ripples spreading outward across a grid of standing cylinders" />
      <img src="./demo-plates/tilt-card.jpg" alt="A card lifting and turning under the cursor" />
    </div>

    <script src="./demo.bundle.js"></script>
    <script>
      const handle = window.Beamish.create(document.getElementById('stage'))
      window.__beamish = handle
      handle.start()
    </script>
  </body>
</html>
