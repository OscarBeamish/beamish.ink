<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spool: Beamish demo</title>
    <link rel="stylesheet" href="../../shared/tokens.css" />
    <link rel="stylesheet" href="../../shared/fonts.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: rgb(var(--background-deep));
        color: var(--label-1);
        font-family: var(--font-mono);
      }
      #stage {
        width: 100vw;
        height: 100vh;
        position: relative;
      }
      /*
       * The images are the content. They are laid out normally and the effect
       * hides them once it has uploaded them, so a browser with no JavaScript
       * shows the pictures and a screen reader still reads the alt text.
       */
      #stage img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <!--
      Standalone. No site chrome: this page exists so the recorder has something
      deterministic to screenshot, and so the effect can be opened on its own
      without a build step. `pnpm build:items` produces demo.bundle.js.
    -->
    <div id="stage">
      <img
        src="./demo-plates/01-rolling-hills.jpg"
        alt="Rolling green hills with a line of trees along the crest"
      />
      <img
        src="./demo-plates/02-lake-boats.jpg"
        alt="Three wooden boats on a turquoise lake below a limestone wall"
      />
      <img
        src="./demo-plates/03-misty-river.jpg"
        alt="A river running through dark conifers with fog caught in the trees"
      />
      <img
        src="./demo-plates/04-flower-pier.jpg"
        alt="A path through purple flowers to a jetty, two volcanoes across the water"
      />
    </div>

    <script src="./demo.bundle.js"></script>
    <script>
      const handle = window.Beamish.create(document.getElementById('stage'))
      window.__beamish = handle
      /*
       * Not while recording. The recorder drives the effect one frame at a time
       * through renderAtTime, and a live loop running alongside it will paint a
       * frame of its own between that call and the screenshot.
       */
      if (!new URLSearchParams(location.search).has('record')) handle.start()
    </script>
  </body>
</html>
