<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sort: Beamish demo</title>
    <link rel="stylesheet" href="../../shared/tokens.css" />
    <link rel="stylesheet" href="../../shared/fonts.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: rgb(var(--background-deep));
        color: var(--label-1);
        font-family: var(--font-mono);
      }
      #stage {
        width: 100vw;
        height: 100vh;
        display: grid;
        place-items: center;
        padding: 0 8vw;
        box-sizing: border-box;
      }
      #stage h1 {
        margin: 0;
        max-width: 18ch;
        font-family: var(--font-display);
        font-size: clamp(2rem, 8vw, 5.5rem);
        font-weight: 700;
        letter-spacing: -0.03em;
        line-height: 0.98;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <!--
      Standalone. No site chrome: this page exists so the recorder has something
      deterministic to screenshot, and so the effect can be opened on its own
      without a build step. `pnpm build:items` produces demo.bundle.js.
    -->
    <div id="stage"><h1>Come to my arms, my beamish boy</h1></div>

    <script src="./demo.bundle.js"></script>
    <script>
      const heading = document.querySelector('#stage h1')
      const handle = window.Beamish.create(heading)

      // The recorder drives renderAtTime itself and must not race a RAF loop.
      window.__beamish = handle
      if (!new URLSearchParams(location.search).has('record')) handle.start()
    </script>
  </body>
</html>
