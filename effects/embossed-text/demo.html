<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EmbossedText: Beamish demo</title>
    <link rel="stylesheet" href="../../shared/tokens.css" />
    <link rel="stylesheet" href="../../shared/fonts.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        /* The sheet, and it has to match the `paper` option: a blind emboss has
           no ink, so the letter face is the page. */
        background: #fbfaf4;
        font-family: var(--font-mono);
      }
      #stage {
        width: 100vw;
        height: 100vh;
        display: grid;
        align-content: center;
        gap: 2rem;
        padding: 0 8vw;
        box-sizing: border-box;
      }
      #stage h1 {
        margin: 0;
        max-width: 14ch;
        font-family: var(--font-display);
        font-size: clamp(2.4rem, 11vw, 8rem);
        font-weight: 700;
        letter-spacing: -0.035em;
        line-height: 0.95;
      }
      #stage p {
        margin: 0;
        font-size: clamp(1.1rem, 3.4vw, 2.3rem);
        letter-spacing: 0.02em;
      }
    </style>
  </head>
  <body>
    <!--
      Standalone. No site chrome: this page exists so the recorder has something
      deterministic to screenshot, and so the effect can be opened on its own
      without a build step. `pnpm build:items` produces demo.bundle.js.

      Two lines: the heading is a blind emboss, which is the best thing this
      does, and the line under it has ink on the type so the two can be
      compared.
    -->
    <div id="stage">
      <h1>Pressed into the sheet</h1>
      <p id="inked">And this one had ink on the type.</p>
    </div>

    <script src="./demo.bundle.js"></script>
    <script>
      const blind = window.Beamish.create(document.querySelector('#stage h1'))
      const inked = window.Beamish.create(document.getElementById('inked'), {
        transfer: 0.9,
        depth: 0.075,
        hold: 900,
        seed: 19
      })

      // The recorder drives renderAtTime itself and must not race a RAF loop.
      // It drives the first handle; the second is given the same clock here so
      // both are a function of the same time.
      window.__beamish = {
        ...blind,
        renderAtTime(t) {
          blind.renderAtTime(t)
          inked.renderAtTime(t)
        },
        update(next) {
          blind.update(next)
        }
      }

      if (!new URLSearchParams(location.search).has('record')) {
        blind.start()
        inked.start()
      }
    </script>
  </body>
</html>
