<!doctype html>
<html lang="en-GB" data-ground="paper">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Magnet: Beamish demo</title>
    <link rel="stylesheet" href="../../shared/tokens.css" />
    <link rel="stylesheet" href="../../shared/fonts.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: rgb(var(--background-deep));
        color: var(--label-1);
        font-family: var(--font-mono);
      }
      #stage {
        width: 100vw;
        height: 100vh;
        display: grid;
        place-items: center;
      }
      /*
       * Demo furniture, not part of the effect. A still frame of a magnet is
       * just a button; a dashed outline of where it sits at rest is what makes
       * the displacement legible in the poster and in a screenshot.
       */
      .rest {
        grid-area: 1 / 1;
        width: 11.4rem;
        height: 3.2rem;
        border: 1px dashed var(--label-4);
        border-radius: 100px;
      }
      /*
       * A plain control, not SheenButton.
       *
       * This item is one idea: an element that leans towards the cursor before
       * the cursor arrives. Mounting it on a button that also has a band of
       * light crossing it means two things are happening and the reader cannot
       * tell which one is the item. The dashed outline is the only other mark
       * here, and it is there to show where the button sits at rest.
       */
      .magnet {
        grid-area: 1 / 1;
        display: grid;
        place-items: center;
        width: 11.4rem;
        height: 3.2rem;
        border: 0;
        border-radius: 100px;
        background: var(--label-1);
        color: rgb(var(--background-deep));
        font-family: var(--font-mono);
        font-size: 0.78rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <!--
      Standalone. No site chrome: this page exists so the recorder has something
      deterministic to screenshot, and so the effect can be opened on its own
      without a build step. `pnpm build:items` produces demo.bundle.js.

      Mounted on an SheenButton, because a magnet is only ever worth putting on
      something worth pressing.
    -->
    <div id="stage">
      <div class="rest" aria-hidden="true"></div>
      <button type="button" class="magnet">Get prompt</button>
    </div>

    <script src="./demo.bundle.js"></script>
    <script>
      const handle = window.Beamish.create(document.querySelector('.magnet'))

      // The recorder drives renderAtTime itself and must not race a RAF loop.
      window.__beamish = handle
      if (!new URLSearchParams(location.search).has('record')) handle.start()
    </script>
  </body>
</html>
