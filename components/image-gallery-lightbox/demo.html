<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Plate: Beamish demo</title>
    <link rel="stylesheet" href="../../shared/tokens.css" />
    <link rel="stylesheet" href="../../shared/fonts.css" />
    <link rel="stylesheet" href="./demo.bundle.css" />
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: rgb(var(--background-deep));
        color: var(--label-1);
        font-family: var(--font-mono);
      }
      #stage {
        width: 100vw;
        min-height: 100vh;
        box-sizing: border-box;
        display: grid;
        align-content: center;
        padding: clamp(1.5rem, 5vw, 4rem);
      }
      .page {
        display: grid;
        gap: 2rem;
        width: min(1000px, 100%);
        margin-inline: auto;
      }
      /*
       * A lower floor than the component ships with. 14rem is right on a page;
       * in a 540px frame it steps the sheet down to one column and makes it
       * taller than the film.
       */
      #mount {
        --plate-floor: 10rem;
      }
      .page h1 {
        font-family: var(--font-display);
        font-size: clamp(1.75rem, 5vw, 3rem);
        font-weight: 700;
        letter-spacing: -0.03em;
        margin: 0;
      }
      .page p {
        margin: -1.4rem 0 0;
        color: var(--label-3);
        font-size: 0.8rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <!--
      Standalone. No site chrome: this page exists so the recorder has something
      deterministic to screenshot, and so the component can be opened on its own
      without a build step. `pnpm build:items` produces demo.bundle.js.

      The plates are the library's own posters and stills, which keeps the demo
      honest: it is a real contact sheet of real images, at mixed orientations,
      rather than six copies of one grey rectangle.
    -->
    <div id="stage">
      <div class="page">
        <h1>Plates</h1>
        <p>Four, mixed orientation</p>
        <div id="mount"></div>
      </div>
    </div>

    <script src="./demo.bundle.js"></script>
    <script>
      window.Beamish.mount(document.getElementById('mount'), {
        label: 'Plates',
        /*
         * Four, not the eight the site panel carries. The frames here are
         * 960x540, 600x600 and 540x960, and the sheet is square cells: eight
         * of them is three rows in the first two, which films as a sheet with
         * its last row sliced off.
         *
         * Two landscape and two portrait, and the overlay opens on a portrait
         * and arrows onto a landscape, because refitting between the two is
         * the thing worth seeing.
         */
        columns: 4,
        autoplay: 3,
        plates: [
          {
            src: './demo-plates/01-dusk-lake.jpg',
            alt: 'A photograph: a lake below snow peaks at dusk',
            width: 900,
            height: 600,
            caption: 'A lake below snow peaks at dusk'
          },
          {
            src: './demo-plates/03-still-water.jpg',
            alt: 'A photograph: flat blue water running out to low hills',
            width: 900,
            height: 1200,
            caption: 'Flat blue water running out to low hills'
          },
          {
            src: './demo-plates/06-glacier-lake.jpg',
            alt: 'A photograph: a glacial lake in flat morning light',
            width: 900,
            height: 1350,
            caption: 'A glacial lake in flat morning light'
          },
          {
            src: './demo-plates/08-emerald-lake.jpg',
            alt: 'A photograph: an emerald lake under a flat-topped mountain',
            width: 900,
            height: 598,
            caption: 'An emerald lake under a flat-topped mountain'
          }
        ]
      })
    </script>
  </body>
</html>
