<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Plate: Beamish demo</title>
    <link rel="stylesheet" href="../../shared/tokens.css" />
    <link rel="stylesheet" href="../../shared/fonts.css" />
    <link rel="stylesheet" href="./demo.bundle.css" />
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: rgb(var(--background-deep));
        color: var(--label-1);
        font-family: var(--font-mono);
      }
      #stage {
        width: 100vw;
        min-height: 100vh;
        box-sizing: border-box;
        display: grid;
        align-content: center;
        padding: clamp(1.5rem, 5vw, 4rem);
      }
      .page {
        display: grid;
        gap: 2rem;
        width: min(1000px, 100%);
        margin-inline: auto;
      }
      .page h1 {
        font-family: var(--font-display);
        font-size: clamp(1.75rem, 5vw, 3rem);
        font-weight: 700;
        letter-spacing: -0.03em;
        margin: 0;
      }
      .page p {
        margin: -1.4rem 0 0;
        color: var(--label-3);
        font-size: 0.8rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <!--
      Standalone. No site chrome: this page exists so the recorder has something
      deterministic to screenshot, and so the component can be opened on its own
      without a build step. `pnpm build:items` produces demo.bundle.js.

      The plates are the library's own posters and stills, which keeps the demo
      honest: it is a real contact sheet of real images, at mixed orientations,
      rather than six copies of one grey rectangle.
    -->
    <div id="stage">
      <div class="page">
        <h1>Plates</h1>
        <p>Six, mixed orientation</p>
        <div id="mount"></div>
      </div>
    </div>

    <script src="./demo.bundle.js"></script>
    <script>
      window.Beamish.mount(document.getElementById('mount'), {
        label: 'Plates',
        columns: 3,
        autoplay: 3,
        plates: [
          {
            src: './demo-plates/overprint.jpg',
            alt: 'Halftone dots in two inks, drifting over warm paper',
            width: 800,
            height: 450,
            caption: 'Overprint, two-colour halftone'
          },
          {
            src: './demo-plates/guilloche.jpg',
            alt: 'Engine-turned line work radiating from a central rosette',
            width: 600,
            height: 1066,
            caption: 'Guilloche, three rosettes'
          },
          {
            src: './demo-plates/contour.jpg',
            alt: 'A ridged landscape drawn as contour lines under a low sun',
            width: 800,
            height: 450,
            caption: 'Contour, displaced relief'
          },
          {
            src: './demo-plates/sundial.jpg',
            alt: 'Long shadows cast across paper by a set of standing forms',
            width: 600,
            height: 1066,
            caption: 'Sundial, cast shadow'
          },
          {
            src: './demo-plates/foil.jpg',
            alt: 'A sheet of foil catching the light where the cursor passes',
            width: 800,
            height: 450,
            caption: 'Foil, pointer-lit'
          },
          {
            src: './demo-plates/swell.jpg',
            alt: 'Ripples spreading outward from the point last touched',
            width: 600,
            height: 1066,
            caption: 'Swell, pointer displacement'
          }
        ]
      })
    </script>
  </body>
</html>
