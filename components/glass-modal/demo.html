<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GlassModal: Beamish demo</title>
    <link rel="stylesheet" href="../../shared/tokens.css" />
    <link rel="stylesheet" href="../../shared/fonts.css" />
    <link rel="stylesheet" href="./demo.bundle.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: rgb(var(--background-deep));
        color: var(--label-1);
        font-family: var(--font-mono);
      }
      #stage {
        position: relative;
        width: 100vw;
        height: 100vh;
        display: grid;
        place-items: center;
        overflow: hidden;
      }
      /*
       * Glass has to have something behind it. On a flat colour there is
       * nothing to blur and nothing to bend, which is the most common way the
       * effect is made to look cheap.
       */
      #stage img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .demo-open {
        position: relative;
        z-index: 1;
        font: inherit;
        font-size: 0.78rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        padding: 0.9rem 1.6rem;
        border-radius: 100px;
        border: 1px solid rgba(255, 255, 255, 0.5);
        background: rgba(255, 253, 247, 0.72);
        color: #26241f;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <!--
      Standalone. No site chrome: this page exists so the recorder has something
      deterministic to screenshot, and so the component can be opened on its own
      without a build step. `pnpm build:items` produces demo.bundle.js.
    -->
    <div id="stage">
      <img
        src="./demo-plates/plate.jpg"
        alt="A facade of small square windows punched in a dark grid, seen from above"
      />
      <button type="button" class="demo-open">Open</button>
      <div id="mount"></div>
    </div>

    <script src="./demo.bundle.js"></script>
    <script>
      const mount = document.getElementById('mount')
      const trigger = document.querySelector('.demo-open')

      let mounted = null
      const render = open => {
        mounted?.unmount()
        mounted = window.Beamish.mount(mount, {
          open,
          title: 'A dialog title',
          onClose: () => render(false),
          children: 'A line of supporting copy inside the sheet, long enough to show how it holds body text against whatever is behind it.'
        })
      }

      trigger.addEventListener('click', () => render(true))
      render(false)
    </script>
  </body>
</html>
